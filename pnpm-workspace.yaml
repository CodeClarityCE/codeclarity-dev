packages:
  - api
  - frontend

# Cooling-off window before a freshly published version may be resolved, in
# minutes. 4320 is 3 days. This defends against the window where a compromised
# release is public but not yet yanked, which is when most npm supply-chain
# attacks are caught. Restored during the 2026-09 dependency refresh; it had
# been pinned to 0 since the yarn-to-pnpm migration, whose lockfile was too
# fresh to satisfy any nonzero gate at the time.
#
# Mirrored in api/.cloud/docker/pnpm-workspace.yaml and
# frontend/.cloud/docker/pnpm-workspace.yaml, which the standalone container
# builds and the node-image CI workflow stage. All three must move together.
minimumReleaseAge: 4320

# Disable pnpm 11's pre-run dependency check: its automatic install ignores
# `allowBuilds` below and fails with ERR_PNPM_IGNORED_BUILDS.
verifyDepsBeforeRun: false

# pnpm 11 replaces `onlyBuiltDependencies` with `allowBuilds` (explicit per-package
# true/false verdict). True allows the lifecycle script to run; false blocks it.
# Anything not listed here is implicitly blocked.
allowBuilds:
  # Native bindings — required for runtime
  bcrypt: true
  "@swc/core": true
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
  msw: true
  vue-demi: true
  # Blocked deliberately (security)
  "@nestjs/core": false # donate-notice script — non-functional, blocked
  "@scarf/scarf": false # telemetry — never allowed

# @nestjs/platform-fastify pins fastify as an exact direct dependency (11.2.3
# pins 5.11.3), so without this the tree carries two fastify copies and the
# instance that actually serves requests is the older one. 5.11.3 is affected
# by GHSA-3m5p-2c4r-xxw2 (X-Forwarded-* spoofing under trustProxy, patched in
# 5.12.1). Mirrored in api/.cloud/docker/pnpm-workspace.yaml for the standalone
# container build; keep both in sync with the fastify pin in api/package.json.
overrides:
  fastify: 5.12.8

auditConfig:
  ignoreCves: []
  ignoreGhsas: []

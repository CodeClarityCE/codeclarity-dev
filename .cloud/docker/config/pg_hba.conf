# CodeClarity Development PostgreSQL Host-Based Authentication
# SSL is optional in development (host instead of hostssl)

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections (inside container)
local   all             all                                     scram-sha-256

# TCP connections from Docker network (SSL optional)
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

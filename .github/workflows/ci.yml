# CI: workflow lint from the central repo, shellcheck, Prettier and tests of the shell scripts (bats for scripts/), and the
# fresh-install tests (dev and production), the production upgrade test, the real-stack e2e journey and the
# results gate, on the runner's empty Docker daemon.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  # Same Node image as the api and frontend toolchain target.
  NODE_IMAGE: node:26.10.0-alpine@sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
  BATS_IMAGE: bats/bats:1.14.0@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f

jobs:
  lint:
    uses: CodeClarityCE/.github/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        # Explicit bash adds pipefail, so findings fail the step through the sed.
        shell: bash
        run: |
          # Every tracked *.sh file, the shared git hook and the bats tests; submodules lint their own.
          # Findings become annotations.
          git ls-files -z '*.sh' .githooks/dispatch 'scripts/tests/*.bats' 'scripts/tests/*.bash' 'scripts/tests/stubs/*' | xargs -0r docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            "$SHELLCHECK_IMAGE" --format=gcc |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): ([a-z]+): (.*)$/::\4 file=\1,line=\2,col=\3::\5/; s/^::note /::notice /'

  # The bats tests of scripts/, with gh stubbed and local bare repos as git remotes.
  script-tests:
    name: script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bats
        # git, jq and the GNU tools the scripts use come from Alpine's signed package index.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo --entrypoint bash "$BATS_IMAGE" -c \
            'apk add --no-cache --quiet git jq coreutils sed grep && bats --print-output-on-failure scripts/tests'

  # Formatting of the tracked Markdown, YAML and JSON files; submodules check their own.
  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: prettier --check
        # The Prettier version root package.json pins, checked against pnpm-lock.yaml's sha512.
        run: |
          git ls-files -z '*.md' '*.yml' '*.yaml' '*.json' | xargs -0 docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            "$NODE_IMAGE" sh .cloud/scripts/prettier-check.sh

  # make up twice on an empty daemon, log in as the default developer account and run an analysis.
  # The knowledge dump image is a small fixture built here, not the published one.
  fresh-install-dev:
    name: fresh install (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      KNOWLEDGE_DUMP_IMAGE: codeclarity-ci/knowledge-dump:fixture
      KNOWLEDGE_FIXTURE_CWE: CWE-99999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the fixture knowledge dump image
        run: sh .cloud/scripts/tests/fresh-install/knowledge-dump-fixture.sh "$KNOWLEDGE_DUMP_IMAGE"
      - name: Fresh install test
        run: sh .cloud/scripts/tests/fresh-install/dev.sh

  # The frontend's real-stack Playwright journey on a trimmed stack built at the submodule pointers.
  e2e-real-stack:
    name: e2e (real stack)
    uses: $/.github/workflows/e2e-real-stack.yml
    permissions:
      contents: read

  # The findings of the results gate's fixtures on the pinned knowledge dump, against expected results (ADR 0021).
  results-gate:
    name: results gate
    uses: $/.github/workflows/results-gate.yml
    permissions:
      contents: read

  # The setup scripts' shell tests, with stand-ins for Postgres and Docker.
  shell-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Shell tests
        run: |
          status=0
          for t in .cloud/scripts/tests/*.test.sh; do
            echo "::group::$t"
            sh "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Fails when a frontend copy of an API enum or allow-list misses values the API defines, or a
  # shared file's vuln-finder copy differs (scripts/type-sync/pairs.txt), at the submodule pointers.
  type-sync:
    name: type sync (api and frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the api, frontend and vuln-finder submodules
        run: |
          git submodule update --init --depth 1 api frontend backend
          git -C backend submodule update --init --depth 1 plugins/vuln-finder
      - name: Test the check
        run: node --test scripts/type-sync/check.test.mjs
      - name: Check the frontend copies against the API
        run: node scripts/type-sync/check.mjs

  # The deployment Compose file, up -d twice on an empty daemon, then create-user and log in
  # through Caddy and run an analysis. The CodeClarity images are built from the submodules.
  fresh-install-production:
    name: fresh install (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      KNOWLEDGE_DUMP_IMAGE: codeclarity-ci/knowledge-dump:fixture
      KNOWLEDGE_FIXTURE_CWE: CWE-99999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the fixture knowledge dump image
        run: sh .cloud/scripts/tests/fresh-install/knowledge-dump-fixture.sh "$KNOWLEDGE_DUMP_IMAGE"
      - name: Build the CodeClarity images from the submodules
        run: sh .cloud/scripts/tests/fresh-install/build-images.sh
      - name: Fresh install test
        run: sh .cloud/scripts/tests/fresh-install/production.sh

  # Installs the newest deployment release, seeds a project, an analysis and a ticket through the API,
  # then upgrades to this checkout's Compose file and checks they are intact (docs/upgrade-test.md).
  # Skips while no release has a Compose file attached.
  upgrade-production:
    name: upgrade (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      KNOWLEDGE_DUMP_IMAGE: codeclarity-ci/knowledge-dump:fixture
      KNOWLEDGE_FIXTURE_CWE: CWE-99999
      UPGRADE_FROM: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the fixture knowledge dump image
        run: sh .cloud/scripts/tests/fresh-install/knowledge-dump-fixture.sh "$KNOWLEDGE_DUMP_IMAGE"
      # The previous release pins its own images by digest; these are the upgrade's.
      - name: Build the CodeClarity images from the submodules
        run: sh .cloud/scripts/tests/fresh-install/build-images.sh
      - name: Upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .cloud/scripts/tests/fresh-install/production.sh

  # The default production stack on arm64 running a real npm analysis, failing on the reference-machine thresholds.
  reference-machine-baseline:
    name: reference machine baseline (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # Built natively on arm64, so the thresholds gate the pointers' code.
      - name: Build the CodeClarity images from the submodules
        run: sh .cloud/scripts/tests/fresh-install/build-images.sh
      - name: Measure the default production stack and check its thresholds
        run: sh .cloud/scripts/measure/reference-baseline.sh run "$RUNNER_TEMP/baseline"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/baseline/summary.md" ]; then cat "$RUNNER_TEMP/baseline/summary.md" >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-machine-baseline
          path: ${{ runner.temp }}/baseline
          if-no-files-found: warn

  # The required check, kept here because called jobs show as "lint / <job>".
  # Fails if any needed job failed or was cancelled; skipped counts as success.
  # CodeQL on every PR and push; outside ci's needs, so findings never fail ci.
  codeql:
    uses: CodeClarityCE/.github/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      go-directory: .devcontainer/broker
      javascript: true

  ci:
    needs:
      - lint
      - shellcheck
      - prettier
      - shell-tests
      - type-sync
      - script-tests
      - fresh-install-dev
      - e2e-real-stack
      - results-gate
      - fresh-install-production
      - upgrade-production
      - reference-machine-baseline
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::A needed job failed or was cancelled: $RESULTS"
            exit 1
          fi

  # Tracks a failing ci on pushes to main and develop in one issue per branch; not the required check.
  report:
    needs: [ci]
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.ci.result == 'success' || needs.ci.result == 'failure') }}
    uses: CodeClarityCE/.github/.github/workflows/ci-report.yml@v1
    permissions:
      issues: write
      actions: read
    with:
      ci-result: ${{ needs.ci.result }}

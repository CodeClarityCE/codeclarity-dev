# CI: workflow lint from the central repo, shellcheck over the shell scripts, and the
# fresh-install test (dev variant) on the runner's empty Docker daemon.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  lint:
    uses: CodeClarityCE/.github/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        # Explicit bash adds pipefail, so findings fail the step through the sed.
        shell: bash
        run: |
          # Every tracked *.sh file; submodules lint their own. Findings become annotations.
          git ls-files -z '*.sh' | xargs -0r docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            "$SHELLCHECK_IMAGE" --format=gcc |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): ([a-z]+): (.*)$/::\4 file=\1,line=\2,col=\3::\5/; s/^::note /::notice /'

  # make up twice on an empty daemon, then log in as the default developer account.
  # The knowledge dump image is a small fixture built here, not the published one.
  fresh-install-dev:
    name: fresh install (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      KNOWLEDGE_DUMP_IMAGE: codeclarity-ci/knowledge-dump:fixture
      KNOWLEDGE_FIXTURE_CWE: CWE-99999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the fixture knowledge dump image
        run: sh .cloud/scripts/tests/fresh-install/knowledge-dump-fixture.sh "$KNOWLEDGE_DUMP_IMAGE"
      - name: Fresh install test
        run: sh .cloud/scripts/tests/fresh-install/dev.sh

  # The required check, kept here because called jobs show as "lint / <job>".
  # Fails if any needed job failed or was cancelled; skipped counts as success.
  ci:
    needs: [lint, shellcheck, fresh-install-dev]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::A needed job failed or was cancelled: $RESULTS"
            exit 1
          fi

# CI: workflow lint from the central repo, shellcheck and tests of the shell scripts, and the
# fresh-install tests (dev and production) and the production upgrade test, on the runner's empty Docker daemon.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  lint:
    uses: CodeClarityCE/.github/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        # Explicit bash adds pipefail, so findings fail the step through the sed.
        shell: bash
        run: |
          # Every tracked *.sh file; submodules lint their own. Findings become annotations.
          git ls-files -z '*.sh' | xargs -0r docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            "$SHELLCHECK_IMAGE" --format=gcc |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): ([a-z]+): (.*)$/::\4 file=\1,line=\2,col=\3::\5/; s/^::note /::notice /'

  # make up twice on an empty daemon, log in as the default developer account and run an analysis.
  # The knowledge dump image is a small fixture built here, not the published one.
  fresh-install-dev:
    name: fresh install (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      KNOWLEDGE_DUMP_IMAGE: codeclarity-ci/knowledge-dump:fixture
      KNOWLEDGE_FIXTURE_CWE: CWE-99999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the fixture knowledge dump image
        run: sh .cloud/scripts/tests/fresh-install/knowledge-dump-fixture.sh "$KNOWLEDGE_DUMP_IMAGE"
      - name: Fresh install test
        run: sh .cloud/scripts/tests/fresh-install/dev.sh

  # The setup scripts' shell tests, with stand-ins for Postgres and Docker.
  shell-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Shell tests
        run: |
          status=0
          for t in .cloud/scripts/tests/*.test.sh; do
            echo "::group::$t"
            sh "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # The deployment Compose file, up -d twice on an empty daemon, then create-user and log in
  # through Caddy and run an analysis. The API image is built from the api submodule.
  fresh-install-production:
    name: fresh install (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      KNOWLEDGE_DUMP_IMAGE: codeclarity-ci/knowledge-dump:fixture
      KNOWLEDGE_FIXTURE_CWE: CWE-99999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the fixture knowledge dump image
        run: sh .cloud/scripts/tests/fresh-install/knowledge-dump-fixture.sh "$KNOWLEDGE_DUMP_IMAGE"
      - name: Build the API image
        run: docker build -q --target api -t codeclarityce/api -f api/.cloud/docker/Dockerfile api
      - name: Fresh install test
        run: sh .cloud/scripts/tests/fresh-install/production.sh

  # Installs the newest deployment release, then upgrades to this checkout's Compose file and
  # checks the data is kept. Skips while no release has a Compose file attached.
  upgrade-production:
    name: upgrade (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      KNOWLEDGE_DUMP_IMAGE: codeclarity-ci/knowledge-dump:fixture
      KNOWLEDGE_FIXTURE_CWE: CWE-99999
      UPGRADE_FROM: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the fixture knowledge dump image
        run: sh .cloud/scripts/tests/fresh-install/knowledge-dump-fixture.sh "$KNOWLEDGE_DUMP_IMAGE"
      # The previous release pins its own API image by digest; this one is the upgrade's.
      - name: Build the API image
        run: docker build -q --target api -t codeclarityce/api -f api/.cloud/docker/Dockerfile api
      - name: Upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .cloud/scripts/tests/fresh-install/production.sh

  # The reference-machine baseline (#162): the default production stack on arm64 running a real npm
  # analysis. It records memory, OOM kills, p95 latency and analysis time, and fails only if the
  # analysis does not complete. Not in the ci gate, so an arm64 runner queue cannot block merges.
  reference-machine-baseline:
    name: reference machine baseline (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Measure the default production stack
        run: sh .cloud/scripts/measure/reference-baseline.sh run "$RUNNER_TEMP/baseline"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/baseline/summary.md" ]; then cat "$RUNNER_TEMP/baseline/summary.md" >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-machine-baseline
          path: ${{ runner.temp }}/baseline
          if-no-files-found: warn

  # The required check, kept here because called jobs show as "lint / <job>".
  # Fails if any needed job failed or was cancelled; skipped counts as success.
  ci:
    needs:
      - lint
      - shellcheck
      - shell-tests
      - fresh-install-dev
      - fresh-install-production
      - upgrade-production
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::A needed job failed or was cancelled: $RESULTS"
            exit 1
          fi

# A one-project, HEAD-only verification study (mirrors the old harness's
# `smoke` subcommand): vuejs/core commits pnpm-lock.yaml, so js-sbom
# resolves a real dependency tree. Used to check auth, org/analyzer/
# integration provisioning, import, submission, polling and result
# persistence end to end.

[study]
name = "smoke"
sample = "sample.json"
snapshots = false
retries = 1

[codeclarity]
org = "js-vuln-study-smoke"
analyzer = "js-vuln-study-v2"

[codeclarity.plugins]
js-sbom = "v0.0.25-alpha"
vuln-finder = "v0.0.25-alpha"
license-finder = "v0.0.18-alpha"
